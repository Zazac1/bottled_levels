plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = 'bottledlevels-neoforge' }

repositories { mavenCentral() }

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client { }
    server { argument '--nogui' }
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"
    // Keeps the 1.21.1 development runtime complete when NeoGradle's local
    // transformed-game cache has been cleared or partially generated. This is
    // compile/runtime-only and is never embedded in the released mod JAR.
    compileOnly files('libs/minecraft-1.21.1-neoforge-dev.jar')
    runtimeOnly files('libs/minecraft-1.21.1-neoforge-dev.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.2'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version,
                'minecraft_version_range': project.minecraft_version_range,
                'neo_version': project.neo_version,
                'loader_version_range': project.loader_version_range
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

// NeoGradle gives the dedicated server a closed input stream by default.
// Keep the launcher-managed Gradle process interactive so `stop`, commands,
// and slash commands typed in the launcher reach the server console.
tasks.withType(JavaExec).configureEach {
    if (name == 'runServer') {
        standardInput = System.in
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
    from('LICENSE') { rename { "${it}_${project.mod_id}" } }
}

publishing { publications { mavenJava(MavenPublication) { artifact jar } } }
