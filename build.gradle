plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archive_base_name
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// Explicit development run profiles so the launcher can start both sides.
	runs {
		client { runDir = 'run-client' }
		server { runDir = 'run-server' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:5.9.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.9.2"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.mod_id}" }
	}
}

tasks.named("test") {
	useJUnitPlatform()
}

// Minecraft 26.2 is unobfuscated, so Loom no longer creates a remapJar task.
// Keep the platform suffix on the distributable jar while the metadata remains
// the requested mod version (1.0.3).
tasks.named("jar") {
	archiveVersion = "${project.mod_version}+${project.minecraft_version}"
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archive_base_name
			from components.java
		}
	}

	repositories {
	}
}
